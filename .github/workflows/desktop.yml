name: Desktop (Windows installer and hub install test)

on:
  push:
    branches: [main]
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install (hoisted node_modules, so the bundled app has no symlinks)
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted
      - name: Build the app in hub mode
        run: pnpm --filter @sentire-pms/web build
      - name: Assemble the hub runtime (app, Postgres 18, Node, service)
        run: node apps/desktop/scripts/prepare-hub.mjs
      - name: Build installer (unsigned until the code-signing certificate arrives, PMS-11)
        run: pnpm --filter @sentire-pms/desktop desktop:build
      - name: Install on this clean Windows runner and start the hub
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Write-Host "Installer: $($exe.Name) $([math]::Round($exe.Length/1MB,1)) MB"
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          Get-Service SentirePMSHub | Format-List Name,Status,StartType
          New-Item -ItemType File -Force "$env:ProgramData\SentirePMS\control\hub.enabled" | Out-Null
          $ok = $false
          for ($i = 0; $i -lt 75; $i++) {
            try { $h = Invoke-RestMethod http://localhost:3000/api/health -TimeoutSec 5; if ($h.db -eq 'ok') { $ok = $true; break } } catch {}
            Start-Sleep 4
          }
          if (-not $ok) { Get-ChildItem "$env:ProgramData\SentirePMS\logs" | ForEach-Object { Write-Host "== $($_.Name)"; Get-Content $_.FullName -Tail 60 }; exit 1 }
          $h | ConvertTo-Json
          $r = Invoke-WebRequest http://localhost:3000/sign-in -MaximumRedirection 0 -SkipHttpErrorCheck
          Write-Host "sign-in answers $($r.StatusCode) -> $($r.Headers.Location)"
          if ("$($r.Headers.Location)" -notmatch "/pair|/setup") { Write-Host "expected the pairing or setup page"; exit 1 }
      - name: Restart the service; the hub comes back with its data
        shell: pwsh
        run: |
          Restart-Service SentirePMSHub
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) { try { $h = Invoke-RestMethod http://localhost:3000/api/health -TimeoutSec 5; if ($h.db -eq 'ok') { $ok = $true; break } } catch {}; Start-Sleep 3 }
          if (-not $ok) { exit 1 }
          Write-Host "hub healthy after restart"
      - name: Uninstall keeps the hotel's data
        shell: pwsh
        run: |
          Start-Process "$env:ProgramFiles\Sentire PMS\uninstall.exe" -ArgumentList '/S' -Wait
          Start-Sleep 5
          if (Get-Service SentirePMSHub -ErrorAction SilentlyContinue) { Write-Host "service still installed"; exit 1 }
          if (-not (Test-Path "$env:ProgramData\SentirePMS\pgdata\PG_VERSION")) { Write-Host "data folder was removed"; exit 1 }
          Write-Host "service removed, data kept"
      - uses: actions/upload-artifact@v4
        with:
          name: sentire-pms-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
