<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sentire PMS</title>
<style>
  :root { --accent:#c2410c; --accent-hover:#9a3412; --border:#e6e6e4; --muted:#636363; --tile:#2b211c; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f7f7f6; color:#171717; font-family: Inter, system-ui, "Segoe UI", sans-serif; }
  section { width:100%; max-width:440px; background:#fff; border:1px solid var(--border); border-radius:12px; padding:32px; }
  .tile { width:44px; height:44px; border-radius:10px; background:var(--tile); color:#fff; font-weight:700; font-size:20px; display:grid; place-items:center; }
  h1 { font-size:22px; margin:16px 0 4px; }
  p { margin:0; color:var(--muted); font-size:14px; }
  label { display:block; font-size:12px; font-weight:600; margin:20px 0 4px; }
  input { width:100%; height:38px; border:1px solid var(--border); border-radius:8px; padding:0 10px; font-size:14px; }
  button { margin-top:14px; width:100%; height:40px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; font-size:14px; cursor:pointer; }
  button:hover { background:var(--accent-hover); }
  .err { color:#991b1b; font-size:13px; margin-top:10px; min-height:18px; }
  .small { font-size:12px; margin-top:8px; }
  .or { margin:18px 0 0; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  #makehub { background:#fff; color:#171717; border:1px solid var(--border); }
  #makehub:hover { background:#fafaf9; }
</style>
</head>
<body>
<section>
  <div class="tile" aria-hidden="true">S</div>
  <h1>Sentire PMS</h1>
  <p id="intro">Connect to your property's hub, or make this PC the hub.</p>
  <div id="hubbox" hidden>
    <button type="button" id="makehub">Make this PC the property hub</button>
    <p class="small">Use this once, on the main front desk PC. It keeps the hotel's data and works without internet. Other PCs and tablets connect to it.</p>
    <div class="or">or connect to a hub</div>
  </div>
  <form id="f">
    <label for="hub">Hub address</label>
    <input id="hub" name="hub" type="url" required placeholder="http://localhost:3000" />
    <button type="submit">Connect</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</section>
<script>
  const KEY = "sentire.hubUrl";
  const input = document.getElementById("hub");
  const err = document.getElementById("err");
  const saved = localStorage.getItem(KEY);
  input.value = saved || "http://localhost:3000";
  async function connect(url, auto) {
    err.textContent = auto ? "Connecting to " + url : "";
    try {
      const ctrl = new AbortController();
      setTimeout(() => ctrl.abort(), 5000);
      const r = await fetch(url.replace(/\/$/, "") + "/api/health", { signal: ctrl.signal });
      const j = await r.json();
      if (j.mode !== "hub") throw new Error("That address is not a Sentire PMS hub.");
      localStorage.setItem(KEY, url);
      location.href = url.replace(/\/$/, "") + "/sign-in";
    } catch (e) {
      err.textContent = "Cannot reach the hub at " + url + ". Check the address and that the hub PC is on.";
    }
  }
  document.getElementById("f").addEventListener("submit", (e) => { e.preventDefault(); connect(input.value.trim(), false); });
  const tauri = window.__TAURI__ && window.__TAURI__.core;
  const LOCAL = "http://localhost:3000";
  async function waitForLocalHub() {
    // The hub service needs up to a few minutes the first time (it creates the database).
    for (let i = 0; i < 90; i++) {
      err.textContent = "Starting the hub on this PC. The first start takes a few minutes. (" + (i * 2) + " s)";
      try {
        const r = await fetch(LOCAL + "/api/health", { cache: "no-store" });
        const j = await r.json();
        if (j.mode === "hub" && j.db === "ok") { localStorage.setItem(KEY, LOCAL); location.href = LOCAL + "/sign-in"; return; }
      } catch (e) {}
      await new Promise((r) => setTimeout(r, 2000));
    }
    err.textContent = "The hub did not start. Restart the PC, or check C:\\ProgramData\\SentirePMS\\logs.";
  }
  (async () => {
    if (tauri) {
      document.getElementById("hubbox").hidden = false;
      document.getElementById("makehub").addEventListener("click", async () => {
        try { await tauri.invoke("enable_hub"); waitForLocalHub(); } catch (e) { err.textContent = String(e); }
      });
      if (await tauri.invoke("hub_enabled") && !saved) { waitForLocalHub(); return; }
    }
    if (saved && !location.hash.includes("change")) connect(saved, true);
  })();
</script>
</body>
</html>
