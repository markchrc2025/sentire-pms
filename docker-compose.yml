services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: pms
      POSTGRES_PASSWORD: pms
      POSTGRES_DB: pms_hub_dev
    ports:
      - "5432:5432"
    volumes:
      - pmsdata:/var/lib/postgresql
      - ./scripts/dev-init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
volumes:
  pmsdata:
